[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yaaw-blender-animation"
version = "0.1.0"
description = "Frame-accurate native Blender motion-design workflow for AI agents"
requires-python = ">=3.11"
authors = [{name = "YAAW contributors"}]
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]
